name: Dev container

# Builds the Codespaces dev container and checks its tools whenever its definition
# changes, so feature bumps (Dependabot) are verified before anyone rebuilds a codespace.
on:
  pull_request:
    paths: ['.devcontainer/**', '.github/workflows/devcontainer.yml']
  push:
    branches: [main]
    paths: ['.devcontainer/**', '.github/workflows/devcontainer.yml']

permissions:
  contents: read

env:
  DEVCONTAINER_CLI: '@devcontainers/cli@0.89.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Build and start the dev container
        run: npx --yes "$DEVCONTAINER_CLI" up --workspace-folder .
      # The feature starts the inner Docker engine in the background; wait up to a minute.
      - name: Docker-in-Docker runs containers and compose
        run: >-
          npx --yes "$DEVCONTAINER_CLI" exec --workspace-folder . bash -lc
          'for i in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 2; done;
          docker info >/dev/null 2>&1 || { sudo tail -n 60 /tmp/dockerd.log; ps aux | grep -i dockerd; exit 1; };
          docker version && docker compose version && docker run --rm hello-world
          && docker compose -f deploy/compose.yaml config --quiet'
      - name: Node.js is the pinned major version
        run: >-
          npx --yes "$DEVCONTAINER_CLI" exec --workspace-folder . bash -lc
          'node --version && node --version | grep -q "^v26\."'
      - name: Terraform and uv are installed
        run: >-
          npx --yes "$DEVCONTAINER_CLI" exec --workspace-folder . bash -lc
          'terraform version && ~/.local/bin/uv --version'
