{{- if .Values.workloadIdentity.clientId }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "casemgr.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
automountServiceAccountToken: false
{{- end }}
